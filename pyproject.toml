[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "google-dorking-tool"
version = "1.2.0"
description = "PySide6 desktop application for authorized Google dorking, OSINT query building, and Custom Search API result export."
readme = "README.md"
requires-python = ">=3.8"
license = "AGPL-3.0-or-later"
authors = [
  { name = "OSINT Security Community" }
]
keywords = ["osint", "google-dorking", "pyside6", "security", "custom-search"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "PySide6>=6.5.0",
  "requests>=2.28.0",
  "cryptography>=41.0.0",
]

[project.scripts]
google-dorking-tool = "main:main"

[tool.setuptools]
py-modules = ["main"]
include-package-data = true

[tool.setuptools.packages.find]
include = ["dork_tool*"]

[tool.setuptools.package-data]
"dork_tool.ui" = ["styles/*.qss", "designer/*.ui"]
